# nginx server block for cashcast.cls9.com (certbot adds the TLS lines).
server {
    listen 80;
    listen [::]:80;
    server_name cashcast.cls9.com;
    client_max_body_size 64k;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml application/vnd.apple.mpegurl;

    # Built page code has content hashes in its file names: cache it for a long time.
    location /dist/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
    }

    # Encrypted segments are public and immutable: let browsers cache them.
    location /media/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }
    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
